spring.application.name=gateway

server.port=${SERVER_PORT:8080}

gateway.routes.cliente-service-url=${CLIENTE_SERVICE_URL:http://localhost:8081}
gateway.routes.loja-service-url=${LOJA_SERVICE_URL:http://localhost:8082}

gateway.rate-limit.limite=${RATE_LIMIT_LIMITE:100}
gateway.rate-limit.janela=${RATE_LIMIT_JANELA:1m}

# HS256, mesmo segredo dos outros serviços. Precisa de pelo menos 32 caracteres.
gateway.jwt.secret=${JWT_SECRET:dev-secret-troque-isso-em-producao!!}

management.endpoints.web.exposure.include=health,metrics
