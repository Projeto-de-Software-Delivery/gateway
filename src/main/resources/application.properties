spring.application.name=gateway

server.port=${SERVER_PORT:8080}

gateway.routes.cliente-service-url=${CLIENTE_SERVICE_URL:http://localhost:8081}
gateway.routes.loja-service-url=${LOJA_SERVICE_URL:http://localhost:8082}
gateway.routes.entregador-service-url=${ENTREGADOR_SERVICE_URL:http://localhost:8000}

gateway.rate-limit.limite=${RATE_LIMIT_LIMITE:100}
gateway.rate-limit.janela=${RATE_LIMIT_JANELA:1m}

management.endpoints.web.exposure.include=health,metrics

# Auth0: domain e audience ficam na application/API criadas no dashboard
# (ver "Guia Configuração - Auth0, Front-End e Back-End.pdf" na raiz do repo).
# Os defaults abaixo são só para a aplicação subir localmente/nos testes sem
# as variáveis definidas; qualquer token real vai falhar a validação contra eles.
auth0.domain=${AUTH0_DOMAIN:example.auth0.com}
auth0.audience=${AUTH0_AUDIENCE:https://example.auth0.com/api/v2/}

# Origens liberadas para o front-end (separadas por vírgula).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
