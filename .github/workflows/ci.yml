name: CI/CD Gateway

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: emilybrtt
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: emilybrtt/gateway:${{ github.sha }}

      - name: Deploy na EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          port: 22
          script: |
            docker stop gateway || true
            docker rm --force gateway || true

            docker pull emilybrtt/gateway:${{ github.sha }}

            docker run -d \
              --name gateway \
              --network rede-delivery \
              -p 8080:8080 \
              -e CLIENTE_SERVICE_URL=http://delivery:8080 \
              -e LOJA_SERVICE_URL=http://delivery:8080 \
              emilybrtt/gateway:${{ github.sha }}
